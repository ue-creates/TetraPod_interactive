<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TetraPod Control</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 既存のスタイル */
    input[type="text"], input[type="number"] { padding: 10px; margin: 5px; width: 80%; box-sizing: border-box; }
    label { display: block; margin-top: 20px; font-weight: bold; color: #aaa; font-size: 0.9rem;}
    
    .control-section {
      background: #222;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    
    #applyBtn {
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.3s;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      width: 100%;
      max-width: 300px;
    }

    /* スライダー用 */
    .slider-row { display: flex; align-items: center; margin-bottom: 10px; }
    .slider-label { width: 30px; font-weight: bold; }
    .slider-val { width: 50px; text-align: right; font-family: monospace; margin-left: 10px; }
    input[type="range"] { flex-grow: 1; cursor: pointer; }
    
    /* HSVスライダー */
    #hRange {
      background: linear-gradient(to right, red, yellow, lime, cyan, blue, magenta, red);
      appearance: none; height: 6px; border-radius: 3px;
    }
    #hRange::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #555; cursor: pointer;
    }
    #colorPreview { width: 100%; height: 40px; margin-top: 15px; border-radius: 6px; border: 2px solid #444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Control Panel</h1>
    
    <div class="control-section">
      <label>DJ / VJ Name</label>
      <input type="text" id="djNameInput" placeholder="Enter DJ Name">
    </div>

    <div class="control-section">
      <label style="margin-bottom: 15px;">Circle Glow Color (HSV)</label>
      <div class="slider-row"><span class="slider-label">H</span><input type="range" id="hRange" min="0" max="360" value="120"><span class="slider-val" id="hVal">120</span></div>
      <div class="slider-row"><span class="slider-label">S</span><input type="range" id="sRange" min="0" max="100" value="100"><span class="slider-val" id="sVal">100</span></div>
      <div class="slider-row"><span class="slider-label">V</span><input type="range" id="vRange" min="0" max="100" value="100"><span class="slider-val" id="vVal">100</span></div>
      <div id="colorPreview" style="background-color: #00ff00;"></div>
    </div>
    
    <div class="control-section">
      <label>Display Ratio (確率: 0% - 100%)</label>
      <div class="slider-row">
        <input type="range" id="ratioRange" min="0" max="100" value="100">
        <span class="slider-val" id="ratioVal">100%</span>
      </div>

      <label>Display Duration (寿命: ms)</label>
      <div class="slider-row">
        <input type="range" id="durationRange" min="500" max="10000" step="100" value="2000">
        <span class="slider-val" id="durationVal">2000</span>
      </div>
    </div>

    <div class="control-section">
      <label>Shake Sensitivity</label>
      <input type="number" id="shakeInput" value="80">
    </div>

    <button id="applyBtn" onclick="updateSettings()">APPLY SETTINGS</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const djNameInput = document.getElementById('djNameInput');
    const shakeInput = document.getElementById('shakeInput');
    const applyBtn = document.getElementById('applyBtn');

    // 追加: 表示調整用エレメント
    const ratioRange = document.getElementById('ratioRange');
    const ratioVal = document.getElementById('ratioVal');
    const durationRange = document.getElementById('durationRange');
    const durationVal = document.getElementById('durationVal');

    // HSV Elements
    const hRange = document.getElementById('hRange');
    const sRange = document.getElementById('sRange');
    const vRange = document.getElementById('vRange');
    const hVal = document.getElementById('hVal');
    const sVal = document.getElementById('sVal');
    const vVal = document.getElementById('vVal');
    const colorPreview = document.getElementById('colorPreview');

    // 現在の設定を受信してフォームに反映
    socket.on('configUpdate', (config) => {
      shakeInput.value = config.shakeSensitivity;
      if(config.djNameText) djNameInput.value = config.djNameText;
      
      // 追加項目の反映
      if(config.displayDuration) {
        durationRange.value = config.displayDuration;
        durationVal.innerText = config.displayDuration;
      }
      if(config.displayRatio !== undefined) {
        const percent = Math.round(config.displayRatio * 100);
        ratioRange.value = percent;
        ratioVal.innerText = percent + '%';
      }
      
      if(config.reactionColor) {
        const [h, s, v] = hexToHsv(config.reactionColor);
        hRange.value = h; sRange.value = s; vRange.value = v;
        updatePreview();
      }
    });

    // イベントリスナー
    [hRange, sRange, vRange].forEach(el => el.addEventListener('input', updatePreview));
    
    ratioRange.addEventListener('input', (e) => { ratioVal.innerText = e.target.value + '%'; });
    durationRange.addEventListener('input', (e) => { durationVal.innerText = e.target.value; });

    function updatePreview() {
      hVal.innerText = hRange.value; sVal.innerText = sRange.value; vVal.innerText = vRange.value;
      colorPreview.style.backgroundColor = hsvToHex(hRange.value, sRange.value, vRange.value);
    }

    function updateSettings() {
      const hexColor = hsvToHex(hRange.value, sRange.value, vRange.value);

      socket.emit('updateConfig', {
        reactionColor: hexColor,
        shakeSensitivity: parseInt(shakeInput.value),
        djNameText: djNameInput.value,
        // 追加項目を送信
        displayDuration: parseInt(durationRange.value),
        displayRatio: parseInt(ratioRange.value) / 100 // 0~100 を 0.0~1.0 に変換
      });

      // ボタン演出
      const originalText = applyBtn.innerText;
      const originalBg = applyBtn.style.background;
      applyBtn.innerText = 'UPDATED! ✅';
      applyBtn.style.background = '#4CAF50';
      applyBtn.style.color = 'white';
      applyBtn.disabled = true;
      setTimeout(() => {
        applyBtn.innerText = originalText;
        applyBtn.style.background = originalBg;
        applyBtn.style.color = '#000';
        applyBtn.disabled = false;
      }, 1000);
    }

    // --- 🛠️ 変換ロジック (変更なし) ---
    function hsvToHex(h, s, v) {
      s /= 100; v /= 100;
      let c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c, r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      r = Math.round((r + m) * 255).toString(16).padStart(2, '0');
      g = Math.round((g + m) * 255).toString(16).padStart(2, '0');
      b = Math.round((b + m) * 255).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`;
    }
    function hexToHsv(hex) { /* (省略: 前回と同じ) */ 
      let r = 0, g = 0, b = 0;
      if (hex.length === 4) { r = parseInt("0x" + hex[1] + hex[1]); g = parseInt("0x" + hex[2] + hex[2]); b = parseInt("0x" + hex[3] + hex[3]); } 
      else if (hex.length === 7) { r = parseInt("0x" + hex.substring(1, 3)); g = parseInt("0x" + hex.substring(3, 5)); b = parseInt("0x" + hex.substring(5, 7)); }
      r /= 255; g /= 255; b /= 255;
      let cmin = Math.min(r, g, b), cmax = Math.max(r, g, b), delta = cmax - cmin, h = 0, s = 0, v = 0;
      if (delta === 0) h = 0; else if (cmax === r) h = ((g - b) / delta) % 6; else if (cmax === g) h = (b - r) / delta + 2; else h = (r - g) / delta + 4;
      h = Math.round(h * 60); if (h < 0) h += 360;
      v = Math.round(cmax * 100); s = cmax === 0 ? 0 : Math.round((delta / cmax) * 100);
      return [h, s, v];
    }
  </script>
</body>
</html>
