<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TetraPod Screen 3 - Ripple</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
        background-color: #000;
        margin: 0;
        overflow: hidden;
        /* 👇 Screen 1と同様、変形コンテナを中央に置くための設定 */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }

    /* 👇 変形させるためのラッパー */
    .screen-trapezoid {
      width: 100%;
      height: 100%;
      position: relative;
      
      /* 👇 ここを変更: 回転軸を下端にする */
      transform-origin: bottom center;
      
      /* 滑らかに動かす */
      transition: transform 0.1s linear; 
      will-change: transform;
    }

    canvas#dotCanvas {
        display: block;
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 150%;
    }
  </style>
</head>
<body>
  
  <div class="screen-trapezoid">
    
    <canvas id="dotCanvas"></canvas>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    // 変形用コンテナを取得
    const screenTrapezoid = document.querySelector('.screen-trapezoid');

    let currentConfig = { reactionColor: '#00ff00' };
    
    // 📐 変形パラメータ
    let currentTransform = {
      perspective: 250,
      rotateX: -10,
      scaleY: 1.0
    };

    // 初期スタイルの適用
    updateTransformStyle();

    function updateTransformStyle() {
      // Screen 1 と同じロジック
      screenTrapezoid.style.transform = `perspective(${currentTransform.perspective}px) rotateX(${currentTransform.rotateX}deg) scale(1.0, ${currentTransform.scaleY})`;
    }

    // ==========================================
    // 📡 設定受信
    // ==========================================
    socket.on('configUpdate', (config) => {
      currentConfig = config;

      // 🟢 Screen 3 個別設定 (config.s3)
      if (config.s3) {
        if (config.s3.persp !== undefined) currentTransform.perspective = config.s3.persp;
        if (config.s3.rotate !== undefined) currentTransform.rotateX = config.s3.rotate;
        if (config.s3.scaleY !== undefined) currentTransform.scaleY = config.s3.scaleY;
        
        updateTransformStyle();
      }
    });

    // ==========================================
    // 🎨 Canvas & ドット設定
    // ==========================================
    const canvas = document.getElementById('dotCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    
    const GRID_SPACING = 40;      
    const BASE_DOT_RADIUS = 2;    
    const MAX_DOT_RADIUS_ADD = 6; 
    const WAVE_SPEED = 0.5;       
    const WAVE_WIDTH = 120;   
    const HEIGHT_MULTIPLIER = 1.5;    

    let dots = [];    
    let ripples = []; 

    function init() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      
      dots = [];
      for (let x = GRID_SPACING / 2; x < width; x += GRID_SPACING) {
        for (let y = GRID_SPACING / 2; y < height; y += GRID_SPACING) {
          dots.push({ x, y });
        }
      }
    }
    window.addEventListener('resize', init);
    init();

    // ==========================================
    // 🌊 シェイク受信時の処理
    // ==========================================
    socket.on('shake', (data) => {
      const startX = Math.random() * width;
      // 下端から波紋が出る設定（回転軸が下になったので、手前から奥へ波が走るように見えます）
      const startY = height + WAVE_WIDTH / 2; 

      ripples.push({
        x: startX,
        y: startY,
        startTime: performance.now(),
        intensity: data.intensity
      });
    });

    // ==========================================
    // 🛠️ 色変換用ユーティリティ (HEX -> RGBA)
    // ==========================================
    function hexToRgba(hex, alpha) {
      let r = 255, g = 255, b = 255;
      if (hex && hex.startsWith('#')) {
        if (hex.length === 7) {
          r = parseInt(hex.substring(1, 3), 16);
          g = parseInt(hex.substring(3, 5), 16);
          b = parseInt(hex.substring(5, 7), 16);
        }
      }
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ==========================================
    // 🎬 描画ループ
    // ==========================================
    function draw() {
      // 背景クリア
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      
      const now = performance.now();
      const targetColor = currentConfig.reactionColor || '#ffffff';

      dots.forEach(dot => {
        let currentRadius = BASE_DOT_RADIUS;
        let alphaAdd = 0; 

        ripples.forEach(ripple => {
            const elapsedTime = now - ripple.startTime;
            const waveRadius = elapsedTime * WAVE_SPEED;
            
            const dx = dot.x - ripple.x;
            const dy = dot.y - ripple.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const distFromWaveCenter = Math.abs(dist - waveRadius);
            
            if (distFromWaveCenter < WAVE_WIDTH / 2) {
                const effect = Math.cos((distFromWaveCenter / (WAVE_WIDTH / 2)) * (Math.PI / 2));
                currentRadius += MAX_DOT_RADIUS_ADD * effect;
                alphaAdd += effect * 0.8; 
            }
        });

        ctx.beginPath();
        ctx.arc(dot.x, dot.y, currentRadius, 0, Math.PI * 2);
        
        const finalAlpha = Math.min(1.0, 0.2 + alphaAdd);
        ctx.fillStyle = hexToRgba(targetColor, finalAlpha);
        ctx.fill();
      });

      const maxDist = Math.sqrt(width * width + height * height) + WAVE_WIDTH;
      ripples = ripples.filter(ripple => {
          const elapsedTime = now - ripple.startTime;
          return (elapsedTime * WAVE_SPEED) < maxDist;
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
