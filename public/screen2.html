<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TetraPod Screen 1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="grid-bg">
  <div class="container" id="visualArea">
    <h1>Screen 2 (Reactions)</h1>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const area = document.getElementById('visualArea');
    let currentConfig = {};

    socket.on('configUpdate', (config) => currentConfig = config);

    // リアクション受信時の処理
    socket.on('reactionTrigger', (data) => {
      // 演出用の要素を生成
      const el = document.createElement('div');
      el.className = 'visual-object';
      
      // ランダムな位置
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.width = '100px';
      el.style.height = '100px';
      el.style.background = currentConfig.reactionColor; // 設定画面の色を反映
      
      // スタンプの種類によってテキストを変えるなど
      const emojis = ['🔥', '❤️', '🙌', '🎉'];
      el.innerText = emojis[data.id - 1] || '●';
      el.style.fontSize = '50px';
      el.style.display = 'flex';
      el.style.justifyContent = 'center';
      el.style.alignItems = 'center';

      area.appendChild(el);

      // 時間経過で消す
      setTimeout(() => {
        el.remove();
      }, currentConfig.displayDuration || 1000);
    });
  </script>
</body>
</html>
