<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TetraPod Input</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div style="padding: 10px;">
      <button id="permissionBtn" style="padding: 10px; display:none;">センサー許可 (iOS)</button>
      <p id="statusText" style="font-size: 12px; color: #888;">Shake your phone!</p>
      </div>
    
    <div class="btn-grid">
      <button class="reaction-btn" onclick="sendReaction(1)">🔥</button>
      <button class="reaction-btn" onclick="sendReaction(2)">❤️</button>
      <button class="reaction-btn" onclick="sendReaction(3)">🙌</button>
      <button class="reaction-btn" onclick="sendReaction(4)">🎉</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentConfig = {}; 

    socket.on('configUpdate', (config) => {
      currentConfig = config;
    });

    function sendReaction(id) {
      socket.emit('reaction', { id: id });
      if (navigator.vibrate) navigator.vibrate(50);
    }

    // --- 👇 新しいシェイク検知ロジック (ハイパスフィルター) 👇 ---
    
    // 重力成分を保持する変数
    let gravityX = 0, gravityY = 0, gravityZ = 0;
    const ALPHA = 0.8; // 重力をどれくらい強く残すか (0.8 = 重力の影響を強く維持＝変化を滑らかに)
    
    let lastShakeTime = 0;
    const SHAKE_COOLDOWN = 800; // 連続反応を防ぐクールダウン (ms)

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if(!acc) return;

      // 1. 初回のみ初期化
      if (gravityX === 0 && gravityY === 0 && gravityZ === 0) {
        gravityX = acc.x; gravityY = acc.y; gravityZ = acc.z;
        return;
      }

      // 2. ローパスフィルター: ゆっくりした変化（重力・傾き）を抽出
      gravityX = ALPHA * gravityX + (1 - ALPHA) * acc.x;
      gravityY = ALPHA * gravityY + (1 - ALPHA) * acc.y;
      gravityZ = ALPHA * gravityZ + (1 - ALPHA) * acc.z;

      // 3. ハイパスフィルター: 全体の加速度から重力・傾き成分を引く
      // これにより、純粋な「動き」による加速度だけが残る
      const accelX = acc.x - gravityX;
      const accelY = acc.y - gravityY;
      const accelZ = acc.z - gravityZ;

      // 4. ベクトルの大きさを計算 (XYZの合成値)
      const force = Math.sqrt(accelX * accelX + accelY * accelY + accelZ * accelZ);

      // デバッグ表示用 (調整が必要な時に使ってね)
      // document.getElementById('debug').innerText = "Force: " + force.toFixed(2);

      // 5. 判定
      // タイピングなどの振動は force が 1~3 程度、強いシェイクは 15~30 以上になるはず
      const threshold = (currentConfig.shakeSensitivity) ? currentConfig.shakeSensitivity : 20;
      const now = Date.now();

      if (force > threshold && (now - lastShakeTime > SHAKE_COOLDOWN)) {
        
        socket.emit('shake', { intensity: force });
        lastShakeTime = now;
        
        const statusText = document.getElementById('statusText');
        statusText.innerText = "SHAKE DETECTED!!";
        statusText.style.color = "#fff";
        statusText.style.fontWeight = "bold";
        
        if (navigator.vibrate) navigator.vibrate(200);

        setTimeout(() => {
          statusText.innerText = "Shake your phone!";
          statusText.style.color = "#888";
          statusText.style.fontWeight = "normal";
        }, 500);
      }
    }

    const btn = document.getElementById('permissionBtn');
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', handleMotion, true);
              btn.style.display = 'none';
            } else {
              alert('許可されませんでした');
            }
          })
          .catch(console.error);
      });
    } else {
      window.addEventListener('devicemotion', handleMotion, true);
    }
  </script>
</body>
</html>
