<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TetraPod Input</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 画面全体をスクロールさせない設定 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }

    /* 全体を縦並びにして画面にフィット */
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: 15px;
      box-sizing: border-box;
    }

    /* ヘッダー部分 */
    .header-section {
      flex: 0 0 auto;
      text-align: center;
      margin-bottom: 10px;
    }

    /* ボタンエリア */
    .btn-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px; /* 👈 ここの隙間とテキストボックスの隙間を合わせます */
      margin-bottom: 15px;
      width: 100%; /* 横幅を明示的に100%に */
    }

    .reaction-btn {
      width: 100%;
      height: 100%;
      margin: 0; /* ブラウザデフォルトの余白を消去 */
      font-size: 3rem;
      border-radius: 16px;
      border: none;
      background-color: #333;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.1s, transform 0.1s;
    }
    .reaction-btn:active {
      background-color: #555;
      transform: translateY(4px);
      box-shadow: 0 0px 2px rgba(0,0,0,0.3);
    }

    /* 👇 ピッタリ揃えるためのテキスト入力エリア設定 */
    .text-input-container {
      flex: 0 0 auto;
      display: flex;
      gap: 15px; /* btn-grid と同じ隙間を指定して統一感を出す */
      width: 100%; /* 横幅をコンテナの限界まで広げる */
      margin-bottom: env(safe-area-inset-bottom, 15px);
      box-sizing: border-box;
    }
    
    #messageInput {
      flex-grow: 1; /* 残りの横幅をすべて使う */
      width: 100%;
      min-width: 0; /* 文字が長くなってもレイアウトを壊さない魔法 */
      margin: 0; /* スマホ特有の謎マージンを消す */
      padding: 15px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #444;
      background-color: #222;
      color: white;
      box-sizing: border-box;
    }
    
    .send-btn {
      flex: 0 0 auto; /* ボタンが伸び縮みしないように固定 */
      margin: 0; /* スマホ特有の謎マージンを消す */
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      white-space: nowrap; /* 「送信」の文字が改行されないようにする */
      box-sizing: border-box;
    }
    .send-btn:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <button id="permissionBtn" style="padding: 10px; display:none; margin: 0 auto 10px;">センサー許可 (iOS)</button>
      <!-- <p id="statusText" style="font-size: 14px; color: #888; margin: 0;">Shake your phone!</p> -->
    </div>
    
    <div class="btn-grid">
      <button class="reaction-btn" onclick="sendReaction(1)">A</button>
      <button class="reaction-btn" onclick="sendReaction(2)">B</button>
      <button class="reaction-btn" onclick="sendReaction(3)">C</button>
      <button class="reaction-btn" onclick="sendReaction(4)">D
        <!-- <img src="img/tetrapod001logo-1.svg" alt="Party" style="width: 50%; height: 100%; object-fit: contain;"> -->
      </button>
    </div>

    <div class="text-input-container">
      <input type="text" id="messageInput" placeholder="メッセージを入力...">
      <button class="send-btn" onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentConfig = { shakeSensitivity: 60 }; 

    socket.on('configUpdate', (config) => {
      currentConfig = config;
    });

    function sendReaction(id) {
      socket.emit('reaction', { id: id });
      if (navigator.vibrate) navigator.vibrate(50);
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim(); 
      
      if (text !== '') {
        socket.emit('textMessage', { text: text });
        input.value = ''; 
        if (navigator.vibrate) navigator.vibrate(50);
      }
    }

    // document.getElementById('messageInput').addEventListener('keypress', function (e) {
    //   if (e.key === 'Enter') {
    //     sendMessage();
    //   }
    // });

    let gravity = { x: 0, y: 0, z: 0 };
    let shakeEnergy = 0; 
    
    const MIN_FORCE = 8;   
    const DECAY_RATE = 2;  
    const COOL_DOWN = 400; 
    
    let lastFireTime = 0;

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;

      const alpha = 0.8;
      gravity.x = alpha * gravity.x + (1 - alpha) * acc.x;
      gravity.y = alpha * gravity.y + (1 - alpha) * acc.y;
      gravity.z = alpha * gravity.z + (1 - alpha) * acc.z;

      const x = acc.x - gravity.x;
      const y = acc.y - gravity.y;
      const z = acc.z - gravity.z;
      
      const force = Math.sqrt(x*x + y*y + z*z);

      if (force > MIN_FORCE) {
        shakeEnergy += force;
      }
      
      shakeEnergy -= DECAY_RATE;
      if (shakeEnergy < 0) shakeEnergy = 0;

      const limit = currentConfig.shakeSensitivity || 60; 
      const now = Date.now();

      if (shakeEnergy > limit && (now - lastFireTime > COOL_DOWN)) {
        socket.emit('shake', { intensity: shakeEnergy });
        lastFireTime = now;
        shakeEnergy = 0; 

        const statusText = document.getElementById('statusText');
        statusText.innerText = "SHAKE DETECTED!!";
        statusText.style.color = "#fff";
        statusText.style.fontWeight = "bold";
        if (navigator.vibrate) navigator.vibrate(200);

        setTimeout(() => {
          statusText.innerText = "Shake your phone!";
          statusText.style.color = "#888";
          statusText.style.fontWeight = "normal";
        }, 500);
      }
    }

    const btn = document.getElementById('permissionBtn');
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', handleMotion, true);
              btn.style.display = 'none';
            } else {
              alert('許可されませんでした');
            }
          })
          .catch(console.error);
      });
    } else {
      window.addEventListener('devicemotion', handleMotion, true);
    }
  </script>
</body>
</html>
