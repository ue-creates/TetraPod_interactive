<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TetraPod Input</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* デバッグ表示用スタイル */
    #debug-panel {
      font-size: 10px;
      color: #555;
      margin-bottom: 10px;
      font-family: monospace;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="padding: 10px;">
      <button id="permissionBtn" style="padding: 10px; display:none;">センサー許可 (iOS)</button>
      <p id="statusText" style="font-size: 12px; color: #888;">Shake your phone!</p>
      
      <div id="debug-panel">
        Force: <span id="val-force">0</span><br>
        Energy: <span id="val-energy">0</span> / Limit: <span id="val-limit">0</span>
      </div>
    </div>
    
    <div class="btn-grid">
      <button class="reaction-btn" onclick="sendReaction(1)">🔥</button>
      <button class="reaction-btn" onclick="sendReaction(2)">❤️</button>
      <button class="reaction-btn" onclick="sendReaction(3)">🙌</button>
      <button class="reaction-btn" onclick="sendReaction(4)">🎉</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    // デフォルト感度設定（管理画面の値が来るまでの初期値）
    // 数値が大きいほど「たくさん振らないと」反応しない
    let currentConfig = { shakeSensitivity: 60 }; 

    socket.on('configUpdate', (config) => {
      currentConfig = config;
      // 管理画面の数値（15とか）だとこのロジックには小さすぎるかもしれないので補正
      // もし管理画面で「300」とか入れているならそのまま使う
      document.getElementById('val-limit').innerText = currentConfig.shakeSensitivity;
    });

    function sendReaction(id) {
      socket.emit('reaction', { id: id });
      if (navigator.vibrate) navigator.vibrate(50);
    }

    // --- 👇 エネルギー蓄積型シェイク検知ロジック 👇 ---

    let gravity = { x: 0, y: 0, z: 0 };
    let shakeEnergy = 0; // バケツの水量
    
    // 【調整パラメータ】
    const MIN_FORCE = 8;   // ノイズ除去の閾値（これ以下の揺れは無視＝タイピング対策）
    const DECAY_RATE = 2;  // 減衰スピード（振るのをやめたらどれくらい早く0に戻るか）
    const COOL_DOWN = 800; // 発火後の不感時間
    
    let lastFireTime = 0;

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;

      // 1. 重力成分の抽出 (簡易ローパスフィルタ)
      const alpha = 0.8;
      gravity.x = alpha * gravity.x + (1 - alpha) * acc.x;
      gravity.y = alpha * gravity.y + (1 - alpha) * acc.y;
      gravity.z = alpha * gravity.z + (1 - alpha) * acc.z;

      // 2. 重力を除去して「動き」だけの力を計算
      const x = acc.x - gravity.x;
      const y = acc.y - gravity.y;
      const z = acc.z - gravity.z;
      
      // 瞬間の力 (Force)
      const force = Math.sqrt(x*x + y*y + z*z);

      // 3. エネルギー蓄積ロジック
      if (force > MIN_FORCE) {
        // 閾値を超えた強い力だけをエネルギーとして足す
        shakeEnergy += force;
      }
      
      // 常にエネルギーを減らす（減衰）
      shakeEnergy -= DECAY_RATE;
      if (shakeEnergy < 0) shakeEnergy = 0;

      // --- デバッグ表示 ---
      document.getElementById('val-force').innerText = force.toFixed(1);
      document.getElementById('val-energy').innerText = shakeEnergy.toFixed(0);
      
      // 4. 判定
      // 管理画面の数値を「満タン」の基準にする
      // 目安: 50〜100くらいが適正範囲になるはず
      const limit = currentConfig.shakeSensitivity || 60; 
      const now = Date.now();

      if (shakeEnergy > limit && (now - lastFireTime > COOL_DOWN)) {
        // 発火！
        socket.emit('shake', { intensity: shakeEnergy });
        lastFireTime = now;
        shakeEnergy = 0; // バケツを空にする

        // フィードバック
        const statusText = document.getElementById('statusText');
        statusText.innerText = "SHAKE DETECTED!!";
        statusText.style.color = "#fff";
        statusText.style.fontWeight = "bold";
        if (navigator.vibrate) navigator.vibrate(200);

        setTimeout(() => {
          statusText.innerText = "Shake your phone!";
          statusText.style.color = "#888";
          statusText.style.fontWeight = "normal";
        }, 500);
      }
    }

    // iOS 13+ 権限リクエスト
    const btn = document.getElementById('permissionBtn');
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', handleMotion, true);
              btn.style.display = 'none';
            } else {
              alert('許可されませんでした');
            }
          })
          .catch(console.error);
      });
    } else {
      window.addEventListener('devicemotion', handleMotion, true);
    }
  </script>
</body>
</html>
