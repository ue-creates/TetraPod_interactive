<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TetraPod Screen 1 (Book Fold)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; padding: 0; background-color: #000; width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    .screen-book-wrapper { width: 100%; height: 100%; display: flex; perspective: 800px; position: relative; z-index: 1; }
    .fold-panel { width: 50%; height: 100%; position: relative; overflow: hidden; will-change: transform; }
    .fold-L { transform-origin: right center; transform: rotateY(-20deg); z-index: 1; }
    .fold-R { transform-origin: left center; transform: rotateY(20deg); z-index: 1; }
    
    .inner-content { position: absolute; top: 0; width: 200%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; }
    .fold-L .inner-content { left: 0; }
    .fold-R .inner-content { left: -100%; }
    
    .visual-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .circle-glow-layer { z-index: 5; } 
    .center-circle { z-index: 10; position: absolute; }
    .visual-object { position: absolute; top: 0; left: 0; will-change: transform; }

    .dj-text-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dj-text-display {
      font-size: 80px;
      text-align: center;
      font-family: "Dela Gothic One", sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      
      background-color: white;
      color: black;
      
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* 初期サイズ */
      width: 1000px;
      height: 150px;
      
    }
  </style>
</head>
<body>

  <div class="screen-book-wrapper" id="bookWrapper">
    <div class="fold-panel fold-L" id="panelL">
      <div class="inner-content">
        <div class="visual-layer" id="visualAreaL"></div>
        <div class="circle-glow-layer" id="glowL"></div>
        <div class="center-circle"></div>
      </div>
    </div>
    <div class="fold-panel fold-R" id="panelR">
      <div class="inner-content">
        <div class="visual-layer" id="visualAreaR"></div>
        <div class="circle-glow-layer" id="glowR"></div>
        <div class="center-circle"></div>
      </div>
    </div>
  </div>

  <div class="dj-text-overlay">
    <div id="djNameDisplay" class="dj-text-display">WAITING...</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const visualAreaL = document.getElementById('visualAreaL');
    const visualAreaR = document.getElementById('visualAreaR');
    const glowL = document.getElementById('glowL');
    const glowR = document.getElementById('glowR');
    const djNameDisplay = document.getElementById('djNameDisplay');
    const panelL = document.getElementById('panelL');
    const panelR = document.getElementById('panelR');
    const bookWrapper = document.getElementById('bookWrapper');

    let currentConfig = { displayRatio: 1.0, displayDuration: 2000 };
    
    let currentTransform = {
      masterScale: 1.0,
      foldAngle: 20,
      perspective: 800,
      scaleX: 1.0,
      skewY: 0 
    };

    updateFoldStyle();

    function updateFoldStyle() {
      const angle = currentTransform.foldAngle || 0;
      const scale = currentTransform.scaleX || 1.0;
      const skew  = currentTransform.skewY || 0;
      const persp = currentTransform.perspective || 800;
      const master = currentTransform.masterScale || 1.0;

      const skewL = skew * -1;
      const skewR = skew;

      panelL.style.transform = `rotateY(-${angle}deg) scaleX(${scale}) skewY(${skewL}deg)`;
      panelR.style.transform = `rotateY(${angle}deg) scaleX(${scale}) skewY(${skewR}deg)`;
      
      bookWrapper.style.perspective = `${persp}px`;
      bookWrapper.style.transform = `scale(${master})`;
    }

    const stampConfig = {
        1: { folder: 'img/stamps/1/', prefix: 'fire_', digits: 4, ext: '.png', start: 1, end: 30, fps: 30, width: 200 },
        2: { folder: 'img/stamps/2/', prefix: 'heartpre01', digits: 4, ext: '.png', start: 1, end: 150, fps: 30, width: 100 },
        3: { folder: 'img/stamps/3/', prefix: 'hand_', digits: 4, ext: '.png', start: 1, end: 60, fps: 24, width: 200 },
        4: { folder: 'img/stamps/4/', prefix: 'party_', digits: 4, ext: '.png', start: 1, end: 60, fps: 30, width: 200 }
    };
    const imageCache = {};
    function preloadImages() {
      for (const [id, cfg] of Object.entries(stampConfig)) {
        imageCache[id] = [];
        for (let i = cfg.start; i <= cfg.end; i++) {
          const src = `${cfg.folder}${cfg.prefix}${String(i).padStart(cfg.digits, '0')}${cfg.ext}`;
          const img = new Image(); img.src = src; imageCache[id].push(img);
        }
      }
    }
    window.onload = preloadImages;

    socket.on('configUpdate', (config) => {
      currentConfig = config;

      if (config.reactionColor) { 
        glowL.style.backgroundColor = config.reactionColor; 
        glowR.style.backgroundColor = config.reactionColor; 
      }

      if (config.s1) {
        if (config.s1.name) djNameDisplay.innerText = config.s1.name;
        if (config.s1.nameHeight !== undefined) djNameDisplay.style.height = config.s1.nameHeight + 'px';
        // 👇 追加: 幅変更
        if (config.s1.nameWidth !== undefined) djNameDisplay.style.width = config.s1.nameWidth + 'px';

        if (config.s1.masterScale !== undefined) currentTransform.masterScale = config.s1.masterScale;
        if (config.s1.fold !== undefined) currentTransform.foldAngle = config.s1.fold;
        if (config.s1.scaleX !== undefined) currentTransform.scaleX = config.s1.scaleX;
        if (config.s1.skewY !== undefined) currentTransform.skewY = config.s1.skewY;
        if (config.s1.persp !== undefined) currentTransform.perspective = config.s1.persp;
        
        updateFoldStyle();
      }
    });

    const MAX_ACTIVE_STAMPS = 10;
    let activeStampCount = 0;
    const GLOBAL_THROTTLE_MS = 100;
    let lastGlobalTriggerTime = 0;

    socket.on('reactionTrigger', (data) => {
      const id = data.id;
      if (!stampConfig[id] || !imageCache[id].length) return;
      if (Math.random() > (currentConfig.displayRatio ?? 1.0)) return;
      const now = Date.now();
      if (now - lastGlobalTriggerTime < GLOBAL_THROTTLE_MS) return;
      if (activeStampCount >= MAX_ACTIVE_STAMPS) return;
      activeStampCount++;
      lastGlobalTriggerTime = now;
      const cfg = stampConfig[id];
      const frames = imageCache[id];
      const CX = window.innerWidth * 0.5;
      const CY = window.innerHeight * 0.5;
      const RADIUS = window.innerHeight * 0.4;
      const angle = Math.random() * 2 * Math.PI;
      let currentX = CX + Math.cos(angle) * RADIUS;
      let currentY = CY + Math.sin(angle) * RADIUS;
      const baseSpeed = window.innerHeight * 0.002;
      const speed = baseSpeed * (1.5 + Math.random() * 2);
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      function createStampElement() {
        const el = document.createElement('div');
        el.className = 'visual-object';
        el.style.width = cfg.width + 'px'; el.style.height = cfg.width + 'px';
        const img = document.createElement('img');
        img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'contain';
        img.src = frames[0].src; el.appendChild(img);
        return { el, img };
      }
      const leftObj = createStampElement();
      const rightObj = createStampElement();
      visualAreaL.appendChild(leftObj.el);
      visualAreaR.appendChild(rightObj.el);
      let frameIndex = 0;
      let lastTime = performance.now();
      const startTime = lastTime;
      const interval = 1000 / cfg.fps;
      function loop(currentTime) {
        const duration = currentConfig.displayDuration || 2000;
        if (currentTime - startTime > duration) { leftObj.el.remove(); rightObj.el.remove(); activeStampCount--; return; }
        currentX += vx; currentY += vy;
        const drawX = currentX - (cfg.width / 2);
        const drawY = currentY - (cfg.width / 2);
        if (drawX > window.innerWidth || drawX + cfg.width < 0 || drawY > window.innerHeight || drawY + cfg.width < 0) {
          leftObj.el.remove(); rightObj.el.remove(); activeStampCount--; return;
        }
        const transformStr = `translate3d(${drawX}px, ${drawY}px, 0)`;
        leftObj.el.style.transform = transformStr;
        rightObj.el.style.transform = transformStr;
        const deltaTime = currentTime - lastTime;
        if (deltaTime > interval) {
          lastTime = currentTime - (deltaTime % interval);
          frameIndex = (frameIndex + 1) % frames.length;
          leftObj.img.src = frames[frameIndex].src;
          rightObj.img.src = frames[frameIndex].src;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
